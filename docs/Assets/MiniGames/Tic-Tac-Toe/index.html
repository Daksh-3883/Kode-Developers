<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Tic-Tac-Toe</h1>
        
        <div id="setup-screen">
            <div class="setup-option">
                <h2>Select Game Mode</h2>
                <div class="btn-group">
                    <button id="singleplayer-btn" class="mode-btn">Singleplayer</button>
                    <button id="multiplayer-btn" class="mode-btn">Multiplayer</button>
                </div>
            </div>
            
            <div class="size-selection">
                <h2>Select Grid Size</h2>
                <div class="btn-group">
                    <button class="size-btn" data-size="3">3×3</button>
                    <button class="size-btn" data-size="5">5×5</button>
                    <button class="size-btn" data-size="7">7×7</button>
                </div>
            </div>
        </div>
        
        <div id="game-screen" class="hidden">
            <div class="game-info">
                <p id="current-player">Player X's turn</p>
                <button id="restart-btn" class="restart-btn">Restart Game</button>
            </div>
            <div id="game-board" class="game-board"></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Kode Developers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="Common.css">
  <link rel="stylesheet" href="projects.css">
</head>
<body class="font-sans overflow-x-hidden dark-theme">

  <!-- Loader -->
  <div id="loader">
    <h1>Kode Developers</h1>
  </div>
  <!-- Navigation Bar -->
  <nav id="navbar"></nav>

  <!-- Page Header -->
  <section class="h-screen flex flex-col justify-center items-center text-center px-6 relative overflow-hidden pt-24">
    <h1 class="text-5xl md:text-6xl font-extrabold mb-6 glow-text leading-tight">
      Our Projects
    </h1>
    <p class="text-lg md:text-xl max-w-2xl leading-relaxed">
      Exploring ideas, building experiments, and creating digital solutions
    </p>
  </section>

  <!-- Projects Section -->
  <section class="py-16 md:py-20 px-6 fade-up">
    <div class="max-w-6xl mx-auto">
      <h2 class="text-3xl md:text-4xl font-bold text-center mb-12">Featured Projects</h2>

      <!-- Projects Grid -->
      <div class="grid md:grid-cols-1 gap-8">
        <!-- Placeholder for future projects -->
        <div class="glass-card p-8 text-center">
          <p class="text-gray-400">
            Our latest projects and experiments will be featured here as they complete.
          </p>
        </div>
      </div>
    </div>
  </section>
  <!-- Footer -->
  <footer data-shared-footer></footer>

  <script src="Common.js"></script>

</html>
